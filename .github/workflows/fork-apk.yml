# Clean Your TV RU (fork): the signed full-flavour release APK.
# - Run by hand: Actions → fork-apk → Run workflow (any branch) → the APK is a workflow artifact.
# - Push a tag vX.Y.Z (matching versionName in app/build.gradle.kts) → also a GitHub Release with the APK.
# The keystore comes from repository secrets (CYT_KEYSTORE_B64, CYT_KEYSTORE_PASSWORD) and never leaves
# $RUNNER_TEMP. The TV add-ons in tv-addons/ are built and bundled into the app first when present.
name: fork-apk

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-apk-${{ github.ref }}
  cancel-in-progress: false

env:
  BUILD_TOOLS: "36.0.0"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    outputs:
      name: ${{ steps.facts.outputs.name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: true          # core/spec reads third_party/cleanyourtv/{examples,themes}
          persist-credentials: false

      - uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Facts (versionName, tag check, file name)
        id: facts
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^ *versionName = "\([0-9][0-9A-Za-z.-]*\)".*/\1/p' app/build.gradle.kts | head -1)
          [ -n "$version" ] || { echo "::error::no versionName in app/build.gradle.kts"; exit 1; }
          if [ "$REF_TYPE" = tag ]; then
            printf '%s' "$REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?(-(alpha|beta|rc)\.?[0-9]+)?$' \
              || { echo "::error::tag $REF_NAME is not vX.Y.Z[.N][-betaN]"; exit 1; }
            [ "${REF_NAME#v}" = "$version" ] || { echo "::error::tag $REF_NAME but versionName $version"; exit 1; }
            name="cleanyourtv-ru-$version"
          else
            name="cleanyourtv-ru-$version-$(git rev-parse --short=12 HEAD)"
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "platforms;android-34" "build-tools;$BUILD_TOOLS" "build-tools;34.0.0" > /dev/null

      - name: Russian translations are complete and well-formed
        run: python3 scripts/fork/check-translations.py . ru

      - name: Release keystore from secrets
        env:
          KEYSTORE_B64: ${{ secrets.CYT_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.CYT_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::set the CYT_KEYSTORE_B64 and CYT_KEYSTORE_PASSWORD repository secrets"; exit 1
          fi
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "CYT_RELEASE_KEYSTORE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
          echo "CYT_ADDON_KEYSTORE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"

      - name: TV add-ons (built, signed and bundled into the app when tv-addons/ exists)
        env:
          CYT_ADDON_KEYSTORE_PASSWORD: ${{ secrets.CYT_KEYSTORE_PASSWORD }}
          CYT_ADDON_KEY_ALIAS: cleanyourtv
        run: |
          if [ -x scripts/fork/bundle-addons.sh ]; then
            PATH="$ANDROID_HOME/build-tools/$BUILD_TOOLS:$PATH" scripts/fork/bundle-addons.sh
          else
            echo "no add-ons in this build"
          fi

      - name: Signed release APK, full flavour (R8)
        env:
          CYT_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.CYT_KEYSTORE_PASSWORD }}
          CYT_RELEASE_KEY_ALIAS: cleanyourtv
        run: |
          # No configuration cache: the signing values must not be persisted in .gradle/.
          ./gradlew :app:assembleFullRelease --no-configuration-cache --max-workers=4 --console=plain \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.p12"

      - name: Verify signature and signer; name the APK
        env:
          NAME: ${{ steps.facts.outputs.name }}
          EXPECTED_SIGNER: ${{ vars.CYT_SIGNER_SHA256 }}
        run: |
          bt="$ANDROID_HOME/build-tools/$BUILD_TOOLS"
          apk=$(ls app/build/outputs/apk/full/release/*.apk | grep -v unsigned | head -1 || true)
          [ -n "$apk" ] || { echo "::error::no signed APK"; ls -l app/build/outputs/apk/full/release/; exit 1; }
          "$bt/apksigner" verify --verbose --print-certs "$apk" | tee "$RUNNER_TEMP/certs.txt"
          signer=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/certs.txt" | head -1)
          if [ -n "$EXPECTED_SIGNER" ] && [ "$signer" != "$EXPECTED_SIGNER" ]; then
            echo "::error::signer $signer is not CYT_SIGNER_SHA256 $EXPECTED_SIGNER"; exit 1
          fi
          "$bt/aapt2" dump badging "$apk" | head -1
          mkdir -p out && cp "$apk" "out/$NAME.apk"
          (cd out && sha256sum "$NAME.apk" > "$NAME.apk.sha256")
          {
            echo "### $NAME.apk"
            echo "- SHA-256: \`$(cut -d' ' -f1 "out/$NAME.apk.sha256")\`"
            echo "- Signer certificate SHA-256: \`$signer\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.facts.outputs.name }}
          path: out/
          retention-days: 30
          if-no-files-found: error

  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.build.outputs.name }}
          path: out
      - name: GitHub Release with the APK
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          pre=""; case "$TAG" in *-*) pre="--prerelease";; esac
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" out/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" out/* --repo "$GITHUB_REPOSITORY" --title "Clean Your TV RU $TAG" --generate-notes --verify-tag $pre
          fi
