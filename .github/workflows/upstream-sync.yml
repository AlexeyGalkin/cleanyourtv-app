# Clean Your TV RU (fork): bring the original app's updates in. Weekly (and by hand), it merges
# udhaykumarbala/cleanyourtv-app's main into a branch made from this fork's default branch:
#   - nothing new: nothing happens;
#   - merges cleanly: the branch is pushed and a pull request opened (or, where Actions may not open pull
#     requests, an issue with the compare link);
#   - conflicts: an issue lists the files to resolve by hand (git merge upstream/main locally).
# After merging, if third_party/cleanyourtv moved, rebuild the TV apps with scripts/fork/build-tv-apks.sh (the
# widget panel patch goes onto the new launcher), and translate new strings (scripts/fork/check-translations.py).
name: upstream-sync

on:
  schedule:
    - cron: "23 5 * * 1"      # Mondays
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "Upstream branch or tag to merge (default: main)"
        required: false
        default: "main"

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Merge upstream
        id: merge
        env:
          REF: ${{ inputs.upstream_ref || 'main' }}
        run: |
          printf '%s' "$REF" | grep -Eq '^[A-Za-z0-9._/-]{1,80}$' || { echo "::error::bad ref $REF"; exit 1; }
          git remote add upstream https://github.com/udhaykumarbala/cleanyourtv-app.git
          # No tags: the fork has its own v0.5.x, which upstream's tags of the same name must not clobber.
          git fetch -q --no-tags upstream "$REF"
          up=$(git rev-parse FETCH_HEAD)
          echo "up=$up" >> "$GITHUB_OUTPUT"
          if git merge-base --is-ancestor "$up" HEAD; then echo "state=none" >> "$GITHUB_OUTPUT"; exit 0; fi
          branch="sync/upstream-${up:0:12}"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then echo "state=known" >> "$GITHUB_OUTPUT"; exit 0; fi
          mb=$(git merge-base HEAD "$up")
          git log --oneline "$mb..$up" | head -40 > "$RUNNER_TEMP/log.txt"
          git diff --name-only "$mb" "$up" -- third_party/cleanyourtv | head -1 > "$RUNNER_TEMP/launcher.txt"
          git config user.name "upstream-sync bot"
          git config user.email "actions@github.com"
          git checkout -q -b "$branch"
          if git merge --no-edit -m "Merge upstream $REF (${up:0:12})" "$up"; then
            # GITHUB_TOKEN may not push changes to .github/workflows: then the merge is left to do by hand.
            if git push -q origin "$branch"; then echo "state=clean" >> "$GITHUB_OUTPUT"
            else echo "state=conflict" >> "$GITHUB_OUTPUT"; echo "(the merge is clean, but it changes .github/workflows, which this token may not push)" > "$RUNNER_TEMP/conflicts.txt"; fi
          else
            echo "state=conflict" >> "$GITHUB_OUTPUT"
            git diff --name-only --diff-filter=U > "$RUNNER_TEMP/conflicts.txt"
            git merge --abort
          fi

      - name: Pull request or issue
        if: steps.merge.outputs.state == 'clean' || steps.merge.outputs.state == 'conflict'
        env:
          GH_TOKEN: ${{ github.token }}
          STATE: ${{ steps.merge.outputs.state }}
          BRANCH: ${{ steps.merge.outputs.branch }}
          UP: ${{ steps.merge.outputs.up }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          {
            echo "Обновления из оригинала (udhaykumarbala/cleanyourtv-app) до \`${UP:0:12}\`."
            echo
            echo "Новые коммиты оригинала:"
            echo '```'
            cat "$RUNNER_TEMP/log.txt"
            echo '```'
            if [ -s "$RUNNER_TEMP/launcher.txt" ]; then
              echo
              echo "**Лаунчер в оригинале обновился.** После слияния пересоберите ТВ-приложения: \`scripts/fork/build-tv-apks.sh\` (наложит панель виджетов на новый лаунчер и обновит пины)."
            fi
            echo
            echo "После слияния проверьте перевод новых строк: \`python3 scripts/fork/check-translations.py . ru\`."
          } > "$RUNNER_TEMP/body.md"
          if [ "$STATE" = clean ]; then
            if ! gh pr create --base "$BASE" --head "$BRANCH" --title "Обновление из оригинала (${UP:0:12})" --body-file "$RUNNER_TEMP/body.md"; then
              { echo "Ветка с обновлением: \`$BRANCH\`. Создать PR: https://github.com/$GITHUB_REPOSITORY/compare/$BASE...$BRANCH"; echo; cat "$RUNNER_TEMP/body.md"; } > "$RUNNER_TEMP/issue.md"
              gh issue create --title "Обновление из оригинала (${UP:0:12})" --body-file "$RUNNER_TEMP/issue.md"
            fi
          else
            { echo "Слияние с оригиналом даёт конфликты в файлах:"; echo '```'; cat "$RUNNER_TEMP/conflicts.txt"; echo '```';
              echo "Решить локально: \`git fetch upstream && git merge upstream/main\`, поправить эти файлы, закоммитить."; echo; cat "$RUNNER_TEMP/body.md"; } > "$RUNNER_TEMP/issue.md"
            gh issue create --title "Обновление из оригинала: нужны ручные правки (${UP:0:12})" --body-file "$RUNNER_TEMP/issue.md"
          fi
